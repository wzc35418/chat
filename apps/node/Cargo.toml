[package]
name = "chat-node"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dev-dependencies]
# 冒烟测试需要真实签名客户端（设备注册/建群/追加/上传会话/能力令牌）。
chat-node-client = { path = "../../crates/node-client" }
chat-protocol = { workspace = true }

[dependencies]
chat-node-api.workspace = true
chat-node-services.workspace = true
# run_node 需要 bind/serve + Ctrl+C 信号 + 独立运行时的驱动能力（版本取自 workspace）。
axum.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "time", "macros", "sync"] }
# 启动时派生节点公钥、校验固定公钥；--init-seed 用安全随机生成种子（均为 workspace 依赖）。
ed25519-dalek.workspace = true
# 证书 SHA-256（公开状态端点用）。
sha2.workspace = true
rand.workspace = true

# TLS 监听（自签/自带证书）：用 tokio-rustls 直接包 TCP 流，再交给 hyper 的自动协议层。
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
hyper = { version = "=1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tower = { version = "=0.5.3", features = ["util"] }
