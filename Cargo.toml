[workspace]
resolver = "2"
members = ["tools/rust-dependency-check", "crates/*", "apps/node"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

# Exact direct versions; Cargo.lock freezes transitive versions as well.
[workspace.dependencies]
chat-protocol = { path = "crates/protocol" }
chat-domain = { path = "crates/domain" }
chat-identity = { path = "crates/identity" }
chat-crypto = { path = "crates/crypto" }
chat-storage = { path = "crates/storage" }
chat-transport = { path = "crates/transport" }
chat-sync = { path = "crates/sync" }
chat-core = { path = "crates/core" }
chat-ffi = { path = "crates/ffi" }
chat-node-services = { path = "crates/node-services" }
chat-node-api = { path = "crates/node-api" }
iroh = "=1.3.0"
openmls = "=0.9.1"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
uniffi = "=0.32.2"
# Match OpenMLS SQLite storage's native sqlite linkage dependency.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
axum = { version = "=0.8.9", features = ["ws"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
bytes = "=1.12.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
chacha20poly1305 = "=0.11.0"
ed25519-dalek = "=3.0.0"
argon2 = "=0.6.0"
sha2 = "=0.11.1"
rand = "=0.10.3"
