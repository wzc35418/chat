[package]
name = "chat-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chat-core.workspace = true
chat-identity.workspace = true
# SYNC-003：常驻同步对象要自己装配 NodeClient 并读持久身份种子/拉取游标。
chat-node-client = { path = "../node-client" }
chat-protocol.workspace = true
chat-storage.workspace = true
rand.workspace = true
uniffi.workspace = true
thiserror.workspace = true

[dev-dependencies]
# ATT-U：附件上传/下载的端到端用例在进程内起真实 node-api 服务（loopback）。
# GROUPS-013：提案编排用例需要真双设备（建群产出 Welcome、对端用 Welcome 加入）。
chat-crypto.workspace = true
chat-node-api.workspace = true
chat-node-client = { path = "../node-client" }
chat-node-services.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
ed25519-dalek.workspace = true

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "chat-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]
