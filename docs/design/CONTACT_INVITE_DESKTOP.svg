<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">桌面端加好友与聊天界面设计稿</title>
  <desc id="desc">左侧好友列表，右侧聊天窗口，中央展示口令加好友对话框。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17332d; }
      .muted { fill: #71837c; }
      .white { fill: #ffffff; }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
      .label { font-size: 17px; font-weight: 600; }
      .title { font-size: 22px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0e2921" flood-opacity=".18"/></filter>
    <clipPath id="window"><rect x="36" y="34" width="1368" height="832" rx="20"/></clipPath>
  </defs>
  <rect width="1440" height="900" fill="#e8eee9"/>
  <rect x="36" y="34" width="1368" height="832" rx="20" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#window)">
    <rect x="36" y="34" width="320" height="832" fill="#f5f8f5"/>
    <rect x="356" y="34" width="1048" height="832" fill="#ffffff"/>
    <line x1="356" y1="34" x2="356" y2="866" stroke="#e2e9e3"/>
    <rect x="59" y="61" width="42" height="42" rx="13" fill="#26725c"/>
    <text x="80" y="89" text-anchor="middle" class="white title">C</text>
    <text x="113" y="81" class="label">Chat</text>
    <text x="113" y="101" class="small muted">加密聊天</text>
    <circle cx="321" cy="81" r="17" fill="#e4eee7"/>
    <text x="321" y="86" text-anchor="middle" class="small">我</text>
    <rect x="59" y="132" width="274" height="44" rx="12" fill="#eaf0eb"/>
    <text x="77" y="160" class="body muted">⌕  搜索好友</text>
    <rect x="59" y="192" width="274" height="45" rx="12" fill="#26725c"/>
    <text x="196" y="221" text-anchor="middle" class="body white" font-weight="600">＋  加好友</text>
    <text x="60" y="273" class="small muted">好友申请</text>
    <rect x="293" y="253" width="39" height="25" rx="12" fill="#fce9d9"/>
    <text x="312" y="270" text-anchor="middle" class="small" fill="#a55e25">2</text>
    <line x1="59" y1="293" x2="333" y2="293" stroke="#dce6df"/>
    <text x="59" y="325" class="small muted">好友  ·  3</text>
    <rect x="48" y="344" width="296" height="78" rx="14" fill="#e4f0e8"/>
    <circle cx="88" cy="382" r="22" fill="#bbd9c4"/>
    <text x="88" y="389" text-anchor="middle" class="label">林</text>
    <text x="121" y="375" class="body" font-weight="600">林间</text>
    <text x="121" y="399" class="small muted">好的，明天见。</text>
    <text x="317" y="376" text-anchor="end" class="small muted">15:28</text>
    <circle cx="88" cy="460" r="22" fill="#d7dcef"/>
    <text x="88" y="467" text-anchor="middle" class="label">青</text>
    <text x="121" y="453" class="body" font-weight="600">青禾</text>
    <text x="121" y="477" class="small muted">文件已收到</text>
    <text x="317" y="454" text-anchor="end" class="small muted">昨天</text>
    <circle cx="88" cy="540" r="22" fill="#f2dfc9"/>
    <text x="88" y="547" text-anchor="middle" class="label">山</text>
    <text x="121" y="533" class="body" font-weight="600">山野</text>
    <text x="121" y="557" class="small muted">等你有空再聊</text>
    <text x="317" y="534" text-anchor="end" class="small muted">周二</text>
    <line x1="356" y1="112" x2="1404" y2="112" stroke="#e6ece7"/>
    <circle cx="397" cy="73" r="22" fill="#bbd9c4"/>
    <text x="397" y="80" text-anchor="middle" class="label">林</text>
    <text x="432" y="72" class="label">林间</text>
    <text x="432" y="94" class="small muted">身份已核验 · 点击查看指纹</text>
    <text x="1369" y="81" text-anchor="end" class="body muted">⋯</text>
    <text x="880" y="155" text-anchor="middle" class="small muted">今天 · 15:22</text>
    <rect x="397" y="184" width="272" height="72" rx="16" fill="#f0f4f0"/>
    <text x="416" y="212" class="body">周末的安排定了吗？</text>
    <text x="416" y="237" class="small muted">15:22</text>
    <rect x="1102" y="280" width="254" height="72" rx="16" fill="#e2f2e7"/>
    <text x="1121" y="308" class="body">定了，周六上午见。</text>
    <text x="1337" y="334" text-anchor="end" class="small muted">15:26 · 已送达</text>
    <rect x="397" y="377" width="240" height="72" rx="16" fill="#f0f4f0"/>
    <text x="416" y="405" class="body">好的，明天见。</text>
    <text x="416" y="430" class="small muted">15:28</text>
    <line x1="356" y1="745" x2="1404" y2="745" stroke="#e6ece7"/>
    <rect x="390" y="767" width="890" height="70" rx="14" fill="#f5f8f5"/>
    <text x="411" y="807" class="body muted">发送消息给林间…</text>
    <rect x="1294" y="780" width="83" height="44" rx="12" fill="#26725c"/>
    <text x="1335" y="808" text-anchor="middle" class="body white">发送</text>
    <rect x="356" y="34" width="1048" height="832" fill="#17332d" opacity=".24"/>
    <rect x="48" y="34" width="308" height="832" fill="#17332d" opacity=".18"/>
    <rect x="720" y="224" width="454" height="448" rx="22" fill="#ffffff" filter="url(#shadow)"/>
    <text x="751" y="266" class="title">口令加好友</text>
    <text x="1140" y="265" text-anchor="end" class="title muted">×</text>
    <text x="751" y="301" class="body muted">粘贴对方分享的一次性加好友口令</text>
    <text x="751" y="345" class="body" font-weight="600">加好友口令</text>
    <rect x="751" y="361" width="392" height="103" rx="12" fill="#f7faf7" stroke="#b9d6c2" stroke-width="2"/>
    <text x="768" y="393" class="body muted">粘贴口令，例如 CHAT1:…</text>
    <text x="751" y="489" class="small muted">口令有有效期，仅用于发起好友申请。</text>
    <text x="751" y="512" class="small muted">核对指纹并经双方确认后才能聊天。</text>
    <rect x="751" y="540" width="392" height="50" rx="12" fill="#26725c"/>
    <text x="947" y="572" text-anchor="middle" class="body white" font-weight="600">验证口令</text>
    <line x1="751" y1="616" x2="1143" y2="616" stroke="#e1e8e2"/>
    <text x="751" y="647" class="small muted">想让别人加你？</text>
    <text x="1139" y="647" text-anchor="end" class="small" fill="#26725c">生成我的口令  →</text>
  </g>
</svg>
